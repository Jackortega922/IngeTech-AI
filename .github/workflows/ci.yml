name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Backend Laravel (Módulo A) ──────────────────────────────
  laravel:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ingetech
          POSTGRES_USER: ingetech
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, pgsql, mbstring, bcmath
          tools: composer:v2

      - name: Instalar dependencias PHP
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Preparar entorno
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Estilo (Pint)
        run: ./vendor/bin/pint --test

      - name: Pruebas (SQLite en memoria)
        run: php artisan test

      - name: Migraciones contra PostgreSQL
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: ingetech
          DB_USERNAME: ingetech
          DB_PASSWORD: secret
        run: php artisan migrate --force

  # ── Frontend (Módulo B) ─────────────────────────────────────
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Ziggy (rutas para el frontend) vive en vendor/; tsc y el build lo necesitan.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2

      - name: Instalar Ziggy (composer)
        run: composer install --no-interaction --no-progress --no-scripts --no-dev

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Formato (Prettier)
        run: npm run format:check

      - name: Lint (ESLint)
        run: npx eslint .

      - name: Tipos (TypeScript)
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  # ── Motor de recomendación (Módulo A) ───────────────────────
  ml-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: ¿Existe el ml-engine?
        id: check
        run: |
          if [ -f ml-engine/requirements.txt ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; \
          else echo "exists=false" >> "$GITHUB_OUTPUT"; echo "ml-engine aún sin requirements — se omite."; fi

      - uses: actions/setup-python@v5
        if: steps.check.outputs.exists == 'true'
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        if: steps.check.outputs.exists == 'true'
        working-directory: ml-engine
        run: pip install -r requirements.txt   # ruff y pytest van pinneados aquí

      - name: Lint (ruff)
        if: steps.check.outputs.exists == 'true'
        working-directory: ml-engine
        run: ruff check .

      - name: Pruebas
        if: steps.check.outputs.exists == 'true'
        working-directory: ml-engine
        run: pytest -q
