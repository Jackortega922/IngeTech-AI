# Blueprint de despliegue para Render (A10). Ver docs/despliegue.md para la guía paso a paso
# (crear cuenta, conectar el repo, base de datos externa, etc.) — este archivo solo describe
# la configuración; Render no crea cuentas ni bases de datos por ti.
#
# Diseño: un solo servicio web. El motor de recomendación NO se despliega como servicio
# aparte — corre como subproceso dentro de este mismo contenedor (RECOMMENDER_MODE=cli, ver
# ADR 0003), así el plan gratuito de Render alcanza para todo el proyecto.
#
# La base de datos NO se define aquí a propósito: el Postgres gratuito de Render expira a los
# 30 días y se borra. Usamos un Postgres externo sin vencimiento (Neon o Supabase, ver
# docs/despliegue.md) y sus credenciales se cargan como variables "sync: false" (secretas,
# se completan a mano en el dashboard de Render, nunca se commitean).

services:
    - type: web
      name: ingetech-ai
      runtime: docker
      dockerfilePath: ./Dockerfile
      plan: free
      healthCheckPath: /up
      envVars:
          - key: APP_NAME
            value: IngeTech AI
          - key: APP_ENV
            value: production
          - key: APP_DEBUG
            value: false
          - key: APP_TIMEZONE
            value: America/Lima
          - key: APP_LOCALE
            value: es
          # En un contenedor los logs tienen que salir por stderr para que la plataforma los
          # recoja. Con el canal por defecto ('stack' -> archivo en storage/logs/laravel.log)
          # los errores quedan atrapados dentro del contenedor: Render muestra las peticiones
          # pero no la excepción, y con APP_DEBUG=false el navegador solo enseña "Server Error".
          - key: LOG_CHANNEL
            value: stderr
          - key: APP_KEY
            sync: false # generar con: php artisan key:generate --show
          - key: APP_URL
            sync: false # la URL que Render asigna al servicio, ej. https://ingetech-ai.onrender.com
          - key: DB_CONNECTION
            value: pgsql
          # Laravel acepta la conexión entera en una sola variable (config/database.php ya
          # lee env('DB_URL')), que es justo el formato que entregan Neon y Supabase. Se usa
          # en vez de DB_HOST/DB_DATABASE/DB_USERNAME/DB_PASSWORD sueltas: una sola credencial
          # que pegar, sin riesgo de equivocarse al separarla, y el sslmode=require que exigen
          # esos proveedores viaja incluido en la propia cadena.
          - key: DB_URL
            sync: false # postgresql://usuario:password@host/basededatos?sslmode=require
          - key: RECOMMENDER_MODE
            value: cli
          - key: RECOMMENDER_CLI
            value: python ml-engine/cli_entry.py
          # Margen amplio a propósito: el plan gratuito da una fracción de CPU, y el costo del
          # motor es arrancar Python e importar scikit-learn/numpy/pandas en cada llamada
          # (~3,5 s ya en hardware rápido), no el cálculo en sí.
          - key: RECOMMENDER_TIMEOUT
            value: 60
